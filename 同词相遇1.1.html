<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>同词相遇</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
body {
    background: linear-gradient(160deg, #1e2a78, #0f1535 60%, #12102a);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 16px;
    color: #e8ecff;
}
#app {
    width: 100%;
    max-width: 420px;
}
h1 {
    text-align: center;
    font-size: 26px;
    letter-spacing: 6px;
    margin-bottom: 14px;
}
.card {
    background: rgba(255, 255, 255, .08);
    border: 1px solid rgba(255, 255, 255, .15);
    border-radius: 16px;
    padding: 18px;
}
.hidden {
    display: none;
}
.mode {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
}
.mode-btn {
    flex: 1;
    padding: 12px 8px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, .25);
    background: rgba(255, 255, 255, .06);
    color: #e8ecff;
    font-size: 15px;
    line-height: 1.6;
}
.mode-btn.on {
    border-color: #7ee0d6;
    background: rgba(126, 224, 214, .18);
    font-weight: 700;
}
.mode-btn small {
    display: block;
    font-size: 12px;
    opacity: .75;
    margin-top: 4px;
}
button {
    cursor: pointer;
}
.primary {
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: #7ee0d6;
    color: #0d1b3a;
    font-size: 16px;
    font-weight: 700;
    margin: 10px 0;
    width: 100%;
}
.secondary {
    padding: 10px;
    border: 1px solid rgba(255, 255, 255, .35);
    border-radius: 12px;
    background: rgba(255, 255, 255, .1);
    color: #fff;
    font-size: 14px;
    margin: 8px 0;
    width: 100%;
}
.row {
    display: flex;
    gap: 8px;
    margin: 10px 0;
}
.row .primary {
    width: auto;
    padding: 12px 18px;
    margin: 0;
}
input {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, .25);
    background: rgba(0, 0, 0, .25);
    color: #fff;
    font-size: 15px;
}
.status {
    font-size: 13px;
    opacity: .85;
    line-height: 1.7;
    min-height: 22px;
}
.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    opacity: .85;
    margin-bottom: 10px;
}
.icon {
    background: none;
    border: 1px solid rgba(255, 255, 255, .3);
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    padding: 4px 8px;
}
.theme {
    text-align: center;
    font-size: 16px;
    margin: 8px 0;
    padding: 10px;
    border-radius: 12px;
    background: rgba(255, 214, 102, .15);
    border: 1px dashed rgba(255, 214, 102, .5);
}
.theme b {
    color: #ffd666;
    font-size: 20px;
}
.hint {
    font-size: 13px;
    opacity: .8;
    text-align: center;
    margin: 6px 0;
    min-height: 20px;
}
.result {
    margin: 12px 0;
    padding: 14px;
    border-radius: 12px;
    background: rgba(0, 0, 0, .3);
    text-align: center;
    line-height: 1.9;
}
.result .ok {
    color: #8ef0c0;
    font-weight: 700;
    font-size: 18px;
    text-shadow: 0 0 12px rgba(142, 240, 192, .8);
}
.result .no {
    color: #ff9a9a;
    font-weight: 700;
    font-size: 18px;
}
.result .word {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
}
.result .word.hit {
    color: #8ef0c0;
    text-shadow: 0 0 14px rgba(142, 240, 192, .7);
    animation: wordPulse 1.1s ease-in-out infinite alternate;
}
@keyframes wordPulse {
    from {text-shadow: 0 0 8px rgba(142,240,192,.4);}
    to {text-shadow: 0 0 20px rgba(142,240,192,.9);}
}
.link {
    background: none;
    border: none;
    color: #9fb4ff;
    font-size: 13px;
    text-decoration: underline;
    margin-top: 6px;
    width: 100%;
}
/* ===== 特效层 ===== */
#fx {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 99;
}
#flash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 98;
    background: radial-gradient(circle at 50% 42%,rgba(255,214,102,.5),rgba(126,224,214,.22) 38%,transparent 72%);
    opacity: 0;
}
#flash.on {
    animation: flash .9s ease-out forwards;
}
@keyframes flash {
    0% {opacity: 0;}
    18% {opacity: 1;}
    100% {opacity: 0;}
}
.result.pop {
    animation: pop .55s cubic-bezier(.2,1.4,.4,1);
}
@keyframes pop {
    0% {transform: scale(.55);opacity: 0;}
    60% {transform: scale(1.07);}
    100% {transform: scale(1);opacity: 1;}
}
.result.win {
    border: 1px solid rgba(142,240,192,.6);
    animation: pop .55s cubic-bezier(.2,1.4,.4,1), glow 1.7s ease-in-out .55s infinite alternate;
}
@keyframes glow {
    from {box-shadow: 0 0 16px rgba(142,240,192,.25);}
    to {box-shadow: 0 0 44px rgba(142,240,192,.6);}
}
.result.lose {
    animation: pop .45s cubic-bezier(.2,1.2,.4,1), shake .5s .1s;
}
@keyframes shake {
    0%,100% {transform: translateX(0);}
    20% {transform: translateX(-8px);}
    40% {transform: translateX(8px);}
    60% {transform: translateX(-5px);}
    80% {transform: translateX(5px);}
}
/* ===== 署名 ===== */
.footer {
    text-align: center;
    font-size: 12px;
    opacity: .45;
    margin-top: 12px;
    letter-spacing: 1px;
}
.footer a {
    color: inherit;
    text-decoration: none;
}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="flash"></div>
<div id="app">
    <h1>同词相遇</h1>
    <!-- 主页 -->
    <div id="home" class="card">
        <div class="mode">
            <button class="mode-btn on" data-mode="free">自由模式<small>任意词语，想到一块就赢</small></button>
            <button class="mode-btn" data-mode="theme">主题模式<small>给出主题，同主题同词赢</small></button>
        </div>
        <button id="createBtn" class="primary">创建房间</button>
        <div class="row">
            <input id="joinCode" placeholder="输入对方房间码" maxlength="8">
            <button id="joinBtn" class="primary">加入</button>
        </div>
        <div id="status" class="status">选择模式后创建房间，把房间码发给朋友。</div>
    </div>
    <!-- 游戏界面 -->
    <div id="game" class="card hidden">
        <div class="top">
            <span id="roomInfo"></span>
            <span style="display:flex;gap:8px;align-items:center">
                <span id="score"></span>
                <button id="soundBtn" class="icon">🔊</button>
            </span>
        </div>
        <div id="themeBox" class="theme hidden">本回合主题：<b id="themeName"></b></div>
        <div id="hint" class="hint"></div>
        <div class="row">
            <input id="wordInput" placeholder="写下你想到的词" maxlength="20">
            <button id="submitBtn" class="primary">提交</button>
        </div>
        <div id="result" class="result hidden"></div>
        <button id="skipThemeBtn" class="secondary hidden">换一个新主题</button>
        <button id="nextBtn" class="primary hidden">下一回合</button>
        <button id="quitBtn" class="link">退出房间</button>
    </div>
</div>
<div class="footer">制作者：花椒</div>

<script>
/* ===== 200 个主题：仅作提示，可随意增删 ===== */
const THEME_NAMES = [
    "水果,蔬菜,动物,主食,零食,饮品,甜品,调味料,海鲜,肉类",
    "早餐食物,火锅食材,烧烤食材,地方小吃,世界名菜,咖啡饮品,茶的种类,酒类,面包糕点,坚果干果",
    "自然景观,天气现象,二十四节气,花卉,鸟类,海洋生物,昆虫,树木,菌菇,矿物宝石",
    "星球,地貌类型,云朵形态,季节,声音,恐龙,微生物,植物器官,农作物,宠物品种",
    "宠物,野生动物,爬行动物,鱼类,农场动物,濒危动物,哺乳动物,候鸟,猫的品种,狗品种",
    "身体部位,五官,内脏器官,情绪,五感,常见疾病,药物,医疗用品,健身动作,中医穴位",
    "家具,家电,厨房用品,卫生间用品,清洁用品,收纳用品,灯具,床上用品,装修材料,房间名称",
    "服装,鞋子,帽子,配饰,面料,传统服饰,职业着装,冬季衣物,夏季衣物,童装",
    "交通工具,汽车品牌,道路设施,交通标志,车站类型,旅行方式,住宿类型,行李物品,旅行证件,旅游地标",
    "手工工具,五金工具,电子元件,电脑硬件,软件类型,编程语言,手机功能,文件格式,人工智能应用,网络用语",
    "职业,学科,文具,办公用品,考试类型,学位名称,科研领域,课堂活动,校园设施,职场场景",
    "电影类型,音乐类型,乐器,舞蹈类型,绘画风格,文学体裁,戏剧角色,摄影题材,手工艺,建筑样式",
    "电子游戏,桌游,棋牌游戏,玩具,户外运动,极限运动,水上运动,球类运动,冬奥项目,体育器材",
    "成语,神话人物,历史人物,历史事件,中国朝代,传统节日,西方节日,民俗活动,宗教场所,世界文化遗产",
    "古诗词名句,歇后语,谚语,汉字部首,修辞手法,标点符号,外语问候语,方言词汇,网络流行语,表情符号",
    "城市,国家,大洲,大洋,河流,山脉,湖泊,岛屿,首都,语言",
    "颜色,几何形状,数字,时间单位,方位,材质,味道,气味,温度感受,性格特点",
    "人际关系,人生阶段,兴趣爱好,童年回忆,校园生活,周末活动,家务劳动,购物场所,餐厅类型,约会场景",
    "手机品牌,运动品牌,饮料品牌,快餐品牌,电商平台,社交软件,视频平台,音乐软件,地图软件,相机品牌",
    "动漫角色,电影角色,电视剧类型,综艺节目,童话角色,超级英雄,科幻设定,恐怖元素,纪录片题材,播客话题"
].join(',').split(',');

const $ = s => document.querySelector(s);
const rand = n => Math.floor(Math.random() * n);
const norm = s => s.trim().toLowerCase().replace(/\s+/g, '');
const genCode = () => Array.from({length:5}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[rand(32)]).join('');

/* ===== 彩带特效 ===== */
const fx = $('#fx'), fctx = fx.getContext('2d');
let parts = [], raf = null;
const COLORS = ['#ffd666','#7ee0d6','#8ef0c0','#ff9ecb','#9fb4ff','#ffffff'];
function resize() {
    const d = devicePixelRatio || 1;
    fx.width = innerWidth * d;
    fx.height = innerHeight * d;
    fctx.setTransform(d,0,0,d,0,0);
}
addEventListener('resize', resize);
resize();

function burst() {
    const cx = innerWidth / 2, cy = innerHeight * 0.45;
    for(let i = 0; i < 140; i++) {
        const a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 8;
        parts.push({
            x: cx, y: cy,
            vx: Math.cos(a) * sp,
            vy: Math.sin(a) * sp - 2.5,
            g: .16 + Math.random() * .12,
            life: 1,
            decay: .011 + Math.random() * .012,
            size: 4 + Math.random() * 7,
            color: COLORS[rand(COLORS.length)],
            rot: Math.random() * Math.PI,
            vr: (Math.random() - .5) * .35,
            shape: rand(3)
        });
    }
    if(!raf) loop();
}
function loop() {
    fctx.clearRect(0,0,innerWidth,innerHeight);
    parts = parts.filter(p => p.life > 0);
    parts.forEach(p => {
        p.vy += p.g;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        p.life -= p.decay;
        fctx.save();
        fctx.globalAlpha = Math.max(p.life, 0);
        fctx.translate(p.x, p.y);
        fctx.rotate(p.rot);
        fctx.fillStyle = p.color;
        if(p.shape === 0) {
            fctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * .6);
        } else if(p.shape === 1) {
            fctx.beginPath();
            fctx.arc(0,0,p.size/2,0,Math.PI*2);
            fctx.fill();
        } else {
            fctx.beginPath();
            fctx.moveTo(0,-p.size/2);
            fctx.lineTo(p.size/2, p.size/2);
            fctx.lineTo(-p.size/2, p.size/2);
            fctx.closePath();
            fctx.fill();
        }
        fctx.restore();
    });
    raf = parts.length ? requestAnimationFrame(loop) : null;
    if(!parts.length) fctx.clearRect(0,0,innerWidth,innerHeight);
}
function flashScreen() {
    const f = $('#flash');
    f.classList.remove('on');
    void f.offsetWidth;
    f.classList.add('on');
}

/* ===== 音效（Web Audio 合成） ===== */
let ac = null, muted = false;
function ensureAudio() {
    try {
        ac = ac || new (window.AudioContext || window.webkitAudioContext)();
        if(ac.state === 'suspended') ac.resume();
    } catch(e) {}
}
addEventListener('pointerdown', ensureAudio, {once:false});
function tone(freq, dur, delay, type, gain) {
    if(!ac || muted) return;
    const t = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain || .15, t + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(ac.destination);
    o.start(t);
    o.stop(t + dur + .05);
}
function playMatch() {
    ensureAudio();
    tone(523.25,.5,0,'triangle',.18);
    tone(659.25,.5,.09,'triangle',.16);
    tone(783.99,.7,.18,'triangle',.16);
    tone(1046.5,.9,.27,'sine',.12);
}
function playMiss() {
    ensureAudio();
    tone(196,.4,0,'sine',.12);
    tone(146.83,.5,.12,'sine',.1);
}
$('#soundBtn').onclick = () => {
    muted = !muted;
    $('#soundBtn').textContent = muted ? '🔇' : '🔊';
};

/* ===== 游戏逻辑 ===== */
let peer = null, conn = null, mode = 'free', isHost = false;
let roomCode = '', myWord = '', otherWord = '', theme = '', round = 0, wins = 0, used = [];

document.querySelectorAll('.mode-btn').forEach(b => b.onclick = () => {
    document.querySelectorAll('.mode-btn').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    mode = b.dataset.mode;
});
$('#createBtn').onclick = createRoom;
$('#joinBtn').onclick = joinRoom;
$('#submitBtn').onclick = submitWord;
$('#skipThemeBtn').onclick = skipTheme;
$('#nextBtn').onclick = () => { if(isHost) nextRound(); };
$('#quitBtn').onclick = () => {
    try { conn && conn.send({type:'quit'}); } catch(e) {}
    location.reload();
};
const setStatus = t => $('#status').textContent = t;

function pickTheme() {
    let pool = THEME_NAMES.filter(t => !used.includes(t));
    if(!pool.length) {
        used = [];
        pool = THEME_NAMES;
    }
    const t = pool[rand(pool.length)];
    used.push(t);
    return t;
}

function createRoom() {
    roomCode = genCode();
    isHost = true;
    peer = new Peer(roomCode, {debug:0});
    peer.on('open', () => setStatus('房间码：' + roomCode + '  等待朋友加入…'));
    peer.on('connection', c => {
        conn = c;
        c.on('open', () => {
            const t = pickTheme();
            c.send({type:'start', mode, theme:t, round:1});
            enterGame(t, 1);
        });
        c.on('data', onData);
        c.on('close', () => setStatus('对方已断开连接'));
    });
    peer.on('error', e => setStatus('创建失败：' + e.type));
}

function joinRoom() {
    const code = $('#joinCode').value.trim().toUpperCase();
    if(!code) return setStatus('请输入房间码');
    roomCode = code;
    isHost = false;
    peer = new Peer({debug:0});
    peer.on('open', () => {
        conn = peer.connect(roomCode, {reliable:true});
        conn.on('open', () => setStatus('已连接，等待房主开始…'));
        conn.on('data', onData);
        conn.on('close', () => setStatus('对方已断开连接'));
    });
    peer.on('error', e => setStatus('连接失败：' + e.type + '，请检查房间码'));
}

function onData(msg) {
    if(msg.type === 'start') {
        mode = msg.mode;
        enterGame(msg.theme, msg.round);
    }
    if(msg.type === 'next') {
        enterGame(msg.theme, msg.round);
    }
    if(msg.type === 'skip') {
        theme = msg.theme;
        applyTheme();
        resetRound();
    }
    if(msg.type === 'submit') {
        otherWord = msg.word;
        if(myWord) maybeReveal();
    }
    if(msg.type === 'reveal') {
        showResult(msg.words, msg.match);
    }
    if(msg.type === 'quit') {
        setStatus('对方已退出房间');
    }
}

function applyTheme() {
    $('#themeName').textContent = theme;
    $('#hint').textContent = mode === 'theme' ? '围绕「' + theme + '」，写下你最先想到的词' : '想到什么就写什么';
}

function resetRound() {
    myWord = '';
    otherWord = '';
    $('#wordInput').value = '';
    $('#wordInput').disabled = false;
    $('#result').classList.add('hidden');
    $('#result').className = 'result hidden';
    $('#nextBtn').classList.add('hidden');
    parts = [];
}

function enterGame(t, r) {
    theme = t;
    round = r;
    $('#home').classList.add('hidden');
    $('#game').classList.remove('hidden');
    $('#roomInfo').textContent = '房间 ' + roomCode + ' · 第 ' + r + ' 回合';
    $('#score').textContent = '相遇成功 ' + wins + ' 次';
    $('#themeBox').classList.toggle('hidden', mode !== 'theme');
    applyTheme();
    resetRound();
}

function skipTheme() {
    if(!isHost) return;
    theme = pickTheme();
    try { conn && conn.send({type:'skip', theme}); } catch(e) {}
    applyTheme();
    resetRound();
}

function submitWord() {
    const w = $('#wordInput').value.trim();
    if(!w) return alert('请先写下一个词');
    myWord = w;
    $('#wordInput').disabled = true;
    try { conn && conn.send({type:'submit', word:w}); } catch(e) {}
    $('#hint').textContent = '已提交，等待对方…';
    if(otherWord) maybeReveal();
}

function maybeReveal() {
    if(!isHost) return;
    const match = norm(myWord) === norm(otherWord);
    if(match) wins++;
    const words = {host: myWord, guest: otherWord};
    try { conn && conn.send({type:'reveal', words, match}); } catch(e) {}
    showResult(words, match);
}

function showResult(words, match) {
    const mine = isHost ? words.host : words.guest;
    const other = isHost ? words.guest : words.host;
    $('#result').classList.remove('hidden');
    if(match) {
        $('#result').className = 'result win';
        $('#result').innerHTML = `
            <div class="ok">相遇成功！</div>
            <div>我：<span class="word hit">${mine}</span></div>
            <div>对方：<span class="word hit">${other}</span></div>
        `;
        burst();
        flashScreen();
        playMatch();
    } else {
        $('#result').className = 'result lose';
        $('#result').innerHTML = `
            <div class="no">擦肩而过</div>
            <div>我：<span class="word">${mine}</span></div>
            <div>对方：<span class="word">${other}</span></div>
        `;
        playMiss();
    }
    $('#score').textContent = '相遇成功 ' + wins + ' 次';
    $('#nextBtn').classList.toggle('hidden', !isHost);
    if(!isHost) $('#hint').textContent = '等待房主开始下一回合…';
}

function nextRound() {
    round++;
    const t = pickTheme();
    try { conn && conn.send({type:'next', theme:t, round}); } catch(e) {}
    enterGame(t, round);
}
</script>
</body>
</html>
